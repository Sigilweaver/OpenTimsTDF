[workspace]
resolver = "2"
members = ["crates/opentimstdf", "crates/opentimstdf-py"]

[workspace.package]
version = "4.0.0"
edition = "2021"
rust-version = "1.95"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenTimsTDF"
homepage = "https://sigilweaver.app/opentimstdf/"
documentation = "https://sigilweaver.app/opentimstdf/docs/"
keywords = ["mass-spectrometry", "bruker", "timstof", "tdf", "proteomics"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
opentimstdf = { path = "crates/opentimstdf" }
openmassspec-core = "4.0.0"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Core 4.0.0 is not on crates.io yet. Pinned by commit so CI runs against the
# exact Core under trial; remove this section when 4.0.0 is published.
[patch.crates-io]
openmassspec-core = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", rev = "ab7b7f7851cc26e518688d04a144c7fc0c42afd5" }
