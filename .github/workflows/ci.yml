name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Same Bruker timsTOF .d bundle validate-mzml.yml downloads (~90 MB
  # zipped), cached under corpus/ so crates/opentimstdf/tests/conformance.rs
  # can exercise a real decode path in CI instead of always skipping - see
  # Sigilweaver/OpenTimsTDF#35. Keep BRUKER_BUNDLE in sync with
  # CI_BUNDLE in crates/opentimstdf/tests/common/mod.rs.
  BRUKER_ZIP_URL: >-
    https://ftp.pride.ebi.ac.uk/pride/data/archive/2022/11/PXD036417/NQO1-F107C_coi-N2-P_200-0C_3996.d.zip
  BRUKER_ZIP_FALLBACK_URL: >-
    https://ftp.ebi.ac.uk/pride/data/archive/2022/11/PXD036417/NQO1-F107C_coi-N2-P_200-0C_3996.d.zip
  BRUKER_ZIP_SHA256: 5f2abbb3ae98c57bece0b427536f3e6f590658dc0049238af3aa88041c1a0b21
  BRUKER_BUNDLE: NQO1-F107C_coi-N2-P_200-0C_3996.d

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Fetching the ~90 MB zip on every OS leg of the matrix would triple
      # the cost for no benefit (the conformance test's decode path isn't
      # OS-specific), so only fetch it on Linux.
      - name: Fetch Bruker sample
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        uses: Sigilweaver/ops/.github/actions/fetch-fixture@cf88ab9d4e06ce360ee0659bde8d10081ea4de17
        with:
          destination: .
          user-agent: OpenTimsTDF-CI/1.0
          fixtures: |
            bruker.d.zip ${{ env.BRUKER_ZIP_SHA256 }} ${{ env.BRUKER_ZIP_URL }} ${{ env.BRUKER_ZIP_FALLBACK_URL }}

      - name: Unzip corpus fixture for conformance tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p corpus
          unzip -q -d corpus bruker.d.zip
          test -d "corpus/$BRUKER_BUNDLE" || (echo "expected bundle dir corpus/$BRUKER_BUNDLE missing" && exit 1)
          rm bruker.d.zip

      - name: cargo test
        run: cargo test --workspace --all-targets
        env:
          # The Linux leg downloads the corpus bundle above, so a missing
          # bundle there is a CI failure, not a skip. Other legs have no
          # corpus and skip the bundle tests.
          REQUIRE_CORPUS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          OPENTIMSTDF_TEST_BUNDLE: ${{ matrix.os == 'ubuntu-latest' && format('corpus/{0}', env.BRUKER_BUNDLE) || '' }}

      - name: Python binding parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install 'maturin>=1.5,<2' numpy pytest
          VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release
          REQUIRE_CORPUS=1 OPENTIMSTDF_TEST_BUNDLE="corpus/$BRUKER_BUNDLE" .venv/bin/python -m pytest tests/test_bindings.py -v

  msrv:
    name: MSRV check (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV)
        run: cargo check --workspace --all-features

  docs-validation:
    name: Shared docs validation
    permissions:
      contents: read
    uses: Sigilweaver/ops/.github/workflows/docs.yml@757c6789b96e3ac05bbc7d1a092d01cbeb0cb9e2
    with:
      tooling-ref: 757c6789b96e3ac05bbc7d1a092d01cbeb0cb9e2
  docs:
    name: Docs (Docusaurus)
    needs: docs-validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      DOCS_RESULT: ${{ needs.docs-validation.result }}
    steps:
      - run: test "$DOCS_RESULT" = success
  # Public API compatibility of the crates.io-published crate against its
  # latest published version. A breaking change without a matching version
  # bump fails; a deliberate major bump passes. OS-independent, so Linux only.
  semver-checks:
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: opentimstdf
