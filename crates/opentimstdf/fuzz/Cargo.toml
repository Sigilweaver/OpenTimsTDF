[package]
name = "opentimstdf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.opentimstdf]
path = ".."

[[bin]]
name = "decode_codec2"
path = "fuzz_targets/decode_codec2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "checked_block_len"
path = "fuzz_targets/checked_block_len.rs"
test = false
doc = false
bench = false

# Standalone workspace so the fuzz crate is not pulled into the parent.
[workspace]

# Core 4.0.0 is not on crates.io yet. Same commit as the workspace root's
# `[patch.crates-io]`; remove this section when 4.0.0 is published.
[patch.crates-io]
openmassspec-core = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", rev = "ab7b7f7851cc26e518688d04a144c7fc0c42afd5" }
